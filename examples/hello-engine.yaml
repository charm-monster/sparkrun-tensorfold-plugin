# A tensorfold-plugin recipe for the fictional `hello-engine` profile on two nodes.
#
# Everything under `tensorfold:` is read by this plugin. Serve values live under `defaults:` like
# every other sparkrun recipe. There are no implicit defaults: every key shown here is required
# unless it is marked optional. The profile itself comes from its own sparkrun plugin package (see
# examples/profile-plugin and docs/PROFILES.md), which must be enabled alongside this plugin.
recipe_version: "2"
description: hello-engine, tensor-parallel over RDMA, tensorfold-plugin example
runtime: tensorfold-plugin

# Directory of the model weights. It exists (or is built, see tensorfold.prepare) at this exact
# path on every node and is mounted into the containers at the same path.
model: /srv/tensorfold/models/hello-model

# The profile runs on 2 or 4 nodes.
min_nodes: 2
max_nodes: 2

# The server needs an API key, so sparkrun cannot run its inference probe. It polls the
# unauthenticated health endpoint the profile names instead.
readiness:
  inference: false

tensorfold:
  profile: hello-engine

  # build: build whatever is missing, then launch.
  # verify: fail with the exact build command if anything is missing.
  prepare: build

  # Host directories, identical on every node, mounted at the same path in the containers.
  paths:
    binaries: /srv/tensorfold/bin
    assets: /srv/tensorfold/models/hello-assets
    kit: /srv/tensorfold/models/kit
    cache_dir: /srv/tensorfold/cache

  # The RDMA fabric between the nodes. Run `rdma link show` and `ip -br addr` to find these.
  network:
    rdma_devices: [rocep1s0f1, roceP2p1s0f1]
    socket_interface: enp1s0f1np1
    gid_index: 3

  # TCP port rank 0 listens on for its followers.
  rendezvous_port: 29620

  # Host path of the file the server reads its API key from. It is mounted read-only on the node
  # that runs rank 0. This plugin never reads it.
  api_key_file: /srv/tensorfold/api.key

defaults:
  host: 0.0.0.0
  port: 8000
  served_model_name: hello-model
  max_model_len: 8192
  parallel: 4
  # optional
  thinking: true
  max_tokens: 1024
  temperature: 0.7
  top_p: 0.9
  top_k: 40
