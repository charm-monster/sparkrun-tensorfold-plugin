name: "ci: test"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check src tests examples
      - run: uv run ruff format --check src tests examples
      - run: uv run mypy src examples/profile-plugin/sparkrun_tensorfold_profile_hello_engine

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sparkrun: ["0.3.10", "0.4.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Type-check against sparkrun ${{ matrix.sparkrun }}
        run: uv run --with "sparkrun==${{ matrix.sparkrun }}" mypy src examples/profile-plugin/sparkrun_tensorfold_profile_hello_engine
      - name: Run tests against sparkrun ${{ matrix.sparkrun }}
        run: uv run --with "sparkrun==${{ matrix.sparkrun }}" pytest --cov=sparkrun_tensorfold_plugin --cov-report=term-missing
