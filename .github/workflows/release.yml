name: "release: release-please"

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing is granted by default; each job asks for what it needs.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      prs_created: ${{ steps.release.outputs.prs_created }}
    steps:
      # GITHUB_TOKEN does not trigger downstream workflows, so the checks in test.yml do not run
      # on the release PR. To have them run, pass a personal access token or a GitHub App token
      # as `token`.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please raises the version in pyproject.toml, which makes `uv sync --locked` fail until
  # uv.lock records the same version. This puts that one line into the release PR's commit.
  sync-lockfile:
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    permissions:
      contents: write
    steps:
      # The push below needs the checkout's credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          ref: release-please--branches--main
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Bring uv.lock to the release version
        run: |
          set -euo pipefail
          uv lock
          if git diff --quiet; then
            echo "uv.lock already matches"
            exit 0
          fi
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add uv.lock
          git commit --amend --no-edit
          git push --force origin HEAD:release-please--branches--main
